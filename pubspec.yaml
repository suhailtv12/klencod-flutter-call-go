name: call_go
description: "A secure and professional P2P audio and video calling app powered by Agora."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # مكتبة اتصالات الصوت والفيديو (Agora RTC)
  agora_rtc_engine: ^6.3.2
  
  # إدارة صلاحيات المايك والكاميرا
  permission_handler: ^11.3.1
  
  # التخزين المحلي
  shared_preferences: ^2.2.2
  
  # أيقونات إضافية
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true